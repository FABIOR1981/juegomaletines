<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Maletines - Valor Esperado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #1b2838 0%, #0b101d 100%);
      --card-bg: rgba(20, 30, 48, 0.75);
      --card-border: rgba(255, 215, 0, 0.25);
      --gold: #ffd700;
      --gold-glow: rgba(255, 215, 0, 0.4);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --green: #10b981;
      --red-val: #ef4444;
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-attachment: fixed;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 30%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      margin-bottom: 20px;
      text-align: center;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 25px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .metric-card h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .metric-card .value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    .metric-card .value.offer {
      color: var(--gold);
      text-shadow: 0 0 12px var(--gold-glow);
    }

    .main-container {
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      gap: 24px;
      width: 100%;
      max-width: 1300px;
    }

    .values-column {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .value-badge {
      font-family: 'Orbitron', sans-serif;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 1px;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 3px 6px rgba(0,0,0,0.3);
    }

    .value-badge.low {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      color: #93c5fd;
    }

    .value-badge.high {
      background: linear-gradient(135deg, #b45309 0%, #78350f 100%);
      border: 1px solid #f59e0b;
      color: #fef08a;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
    }

    .value-badge.eliminated {
      background: rgba(15, 23, 42, 0.4) !important;
      border-color: rgba(255, 255, 255, 0.05) !important;
      color: #334155 !important;
      text-shadow: none !important;
      opacity: 0.4;
      transform: scale(0.96);
    }

    .value-badge.eliminated::after {
      content: '';
      position: absolute;
      top: 50%; left: 10%; right: 10%;
      height: 2px;
      background: var(--red-val);
      transform: translateY(-50%);
      box-shadow: 0 0 6px var(--red-val);
    }

    .cases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 14px;
      align-content: start;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .case {
      position: relative;
      aspect-ratio: 1.25;
      background: linear-gradient(135deg, #382d18 0%, #8a6a1f 35%, #ffd700 50%, #8a6a1f 65%, #2a200f 100%);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      border: 1px solid #ffe066;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .case::before {
      content: '';
      position: absolute;
      top: 3px; left: 3px; right: 3px; bottom: 3px;
      border: 1px solid rgba(0, 0, 0, 0.3);
      border-radius: 7px;
      pointer-events: none;
    }

    .case:hover:not(.opened) {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.7), 0 0 15px var(--gold-glow);
    }

    .case .handle {
      position: absolute;
      top: -6px;
      width: 36px;
      height: 8px;
      background: linear-gradient(90deg, #444, #ccc, #444);
      border-radius: 3px 3px 0 0;
      border: 1px solid #111;
    }

    .case .num {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: #1a1202;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
      z-index: 2;
    }

    .case .val-hidden {
      display: none;
    }

    .case.opened {
      background: linear-gradient(135deg, #0d131f 0%, #172033 100%);
      border-color: #1e293b;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.8);
      cursor: default;
      transform: none;
    }

    .case.opened .handle {
      background: #222;
      border-color: #000;
    }

    .case.opened .num {
      font-size: 0.85rem;
      color: #475569;
      margin-bottom: 2px;
      text-shadow: none;
    }

    .case.opened .val-hidden {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--red-val);
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .controls {
      margin-top: 30px;
      display: flex;
      gap: 15px;
    }

    .reset-btn {
      font-family: 'Orbitron', sans-serif;
      padding: 12px 30px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: white;
      border: 1px solid #f87171;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.6);
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    }

    @media (max-width: 900px) {
      .main-container {
        grid-template-columns: 1fr;
      }
      .dashboard {
        grid-template-columns: 1fr;
      }
      .values-column {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      }
    }
  </style>
</head>
<body>

  <h1>Simulador de Maletines</h1>

  <div class="dashboard">
    <div class="metric-card">
      <h3>Maletines Restantes</h3>
      <div class="value" id="remaining-count">26</div>
    </div>
    <div class="metric-card">
      <h3>Valor Esperado (VE)</h3>
      <div class="value" id="ve-val">$0</div>
    </div>
    <div class="metric-card">
      <h3>Oferta Estimada Banca</h3>
      <div class="value offer" id="bank-offer">$0</div>
    </div>
  </div>

  <div class="main-container">
    <div class="values-column" id="low-values-list"></div>
    <div class="cases-grid" id="cases-grid"></div>
    <div class="values-column" id="high-values-list"></div>
  </div>

  <div class="controls">
    <button class="reset-btn" onclick="initGame()">Reiniciar Juego</button>
  </div>

  <script>
    const INITIAL_VALUES = [
      1, 2, 5, 10, 25, 50, 75, 100, 200, 300, 400, 500, 750,
      1000, 2500, 5000, 10000, 20000, 30000, 40000, 50000, 75000, 100000, 250000, 500000, 1000000
    ];

    let cases = [];
    let remainingValues = [];

    function formatMoney(amount) {
      return '$' + amount.toLocaleString('es-ES');
    }

    function shuffle(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initGame() {
      const shuffledValues = shuffle(INITIAL_VALUES);
      remainingValues = [...INITIAL_VALUES];
      cases = [];

      for (let i = 0; i < 26; i++) {
        cases.push({
          id: i + 1,
          value: shuffledValues[i],
          opened: false
        });
      }

      renderBoard();
      updateMetrics();
    }

    function renderBoard() {
      const lowList = document.getElementById('low-values-list');
      const highList = document.getElementById('high-values-list');
      lowList.innerHTML = '';
      highList.innerHTML = '';

      INITIAL_VALUES.slice(0, 13).forEach(val => {
        const badge = document.createElement('div');
        badge.className = `value-badge low ${!remainingValues.includes(val) ? 'eliminated' : ''}`;
        badge.innerText = formatMoney(val);
        lowList.appendChild(badge);
      });

      INITIAL_VALUES.slice(13).forEach(val => {
        const badge = document.createElement('div');
        badge.className = `value-badge high ${!remainingValues.includes(val) ? 'eliminated' : ''}`;
        badge.innerText = formatMoney(val);
        highList.appendChild(badge);
      });

      const grid = document.getElementById('cases-grid');
      grid.innerHTML = '';

      cases.forEach(c => {
        const caseEl = document.createElement('div');
        caseEl.className = `case ${c.opened ? 'opened' : ''}`;
        caseEl.onclick = () => openCase(c.id);

        caseEl.innerHTML = `
          <div class="handle"></div>
          <div class="num">${c.id}</div>
          <div class="val-hidden">${c.opened ? formatMoney(c.value) : ''}</div>
        `;
        grid.appendChild(caseEl);
      });
    }

    function openCase(id) {
      const c = cases.find(item => item.id === id);
      if (c.opened) return;

      c.opened = true;
      const idx = remainingValues.indexOf(c.value);
      if (idx !== -1) {
        remainingValues.splice(idx, 1);
      }

      renderBoard();
      updateMetrics();
    }

    function updateMetrics() {
      const count = remainingValues.length;
      document.getElementById('remaining-count').innerText = count;

      if (count === 0) {
        document.getElementById('ve-val').innerText = '$0';
        document.getElementById('bank-offer').innerText = '$0';
        return;
      }

      const sum = remainingValues.reduce((a, b) => a + b, 0);
      const ve = sum / count;

      const factorOferta = 0.60 + ((26 - count) / 25) * 0.25; 
      const oferta = ve * factorOferta;

      document.getElementById('ve-val').innerText = formatMoney(Math.round(ve));
      document.getElementById('bank-offer').innerText = formatMoney(Math.round(oferta));
    }

    initGame();
  </script>
</body>
</html>
